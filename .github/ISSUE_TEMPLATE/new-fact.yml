name: New fact
description: Add a fact you already wrote, with its source article.
labels: [fact]
body:
  - type: markdown
    attributes:
      value: |
        There's no CI summarization step — write the fact yourself, or use
        the on-device Shortcut, then file it here with its source and tags.
  - type: input
    id: url
    attributes:
      label: Article URL
      description: The source article for this fact.
      placeholder: https://example.com/article
    validations:
      required: true
  - type: textarea
    id: fact
    attributes:
      label: Fact
      description: One or two sentences, under 280 characters.
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: >-
        Comma-separated, 1-3, chosen from: space, history, biology, language,
        food, technology, psychology, geography, music, sport, medicine,
        oddities, tv, world record.
      placeholder: space, history
    validations:
      required: true
