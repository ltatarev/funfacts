name: Add fact

on:
  issues:
    types: [opened, labeled, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Number of the issue to process again.
        required: true

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: facts-write
  cancel-in-progress: false

jobs:
  add-fact:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
      (github.event.action != 'labeled' || github.event.label.name == 'fact') &&
      (contains(github.event.issue.labels.*.name, 'fact') ||
      contains(github.event.issue.body, '### Article URL')))
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Resolve issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        run: |
          author=$(gh api "repos/${{ github.repository }}/issues/$NUMBER" --jq .user.login)
          if [ "$author" != "${{ github.repository_owner }}" ]; then
            echo "issue #$NUMBER is not from ${{ github.repository_owner }}"
            exit 1
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
      - run: npx tsx scripts/add-fact.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
      - name: Commit fact
        id: commit
        run: |
          if git diff --quiet -- data/facts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/facts.json
          git commit -m "Add fact from issue #${{ steps.issue.outputs.number }}"
          # Another run can push between the checkout and this push, so rebase
          # and try again.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push $attempt was rejected; rebase and try again"
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "rebase failed; data/facts.json needs a manual merge"
              exit 1
            fi
          done
          echo "push failed after 5 attempts"
          exit 1

      - name: Reopen the issue when the commit fails
        if: failure() && steps.commit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue reopen "$NUMBER" --repo "${{ github.repository }}" || true
          gh issue edit "$NUMBER" --repo "${{ github.repository }}" --add-label needs-attention || true
          gh issue comment "$NUMBER" --repo "${{ github.repository }}" --body \
            "The fact parsed, but the commit to \`data/facts.json\` failed. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Edit this issue to run the workflow again."

  deploy:
    needs: add-fact
    if: needs.add-fact.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
